# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: 'ko-KR'
early_access: true
reviews:
    profile: 'chill'
    request_changes_workflow: false
    changed_files_summary: false
    sequence_diagrams: false
    suggested_reviewers: false
    auto_assign_reviewers: false
    high_level_summary: true
    poem: false
    review_status: true
    collapse_walkthrough: false
    auto_review:
        enabled: true
        ignore_title_keywords:
            - 'WIP'
            - 'DO NOT MERGE'
            - 'SWEEP'
        drafts: false
        base_branches:
            - main
            - release/.*
            - dev
    pre_merge_checks:
        docstrings:
            mode: 'off'
    path_instructions:
        - path: '**/*'
          instructions: |
              Follow the repository's formatter, linter, test runner, and local development instructions as the source of truth.
              Use UTF-8, LF line endings, a final newline, and no trailing whitespace.
              Follow the configured 130-character print width and indentation settings instead of requesting manual visual alignment.
              Resolve TODOs that are in scope for the change and remove debugging console.log statements.
              Use .test.ts or .test.tsx for tests. Tests normally live under src/test, while established colocated tests are also valid.
              Give describe and test blocks clear behavior-oriented names.
              Keep tests independent, focused on one behavior, and readable without over-abstracting setup.
              Cover meaningful edge cases and observable behavior rather than implementation details.
              Isolate external dependencies and restore modified global state, timers, and spies after each test.
              Prefer clear names, self-explanatory code, and only the functionality required by the current task.
              Do not require user-visible strings to be externalized unless localization infrastructure exists in the changed scope.

        - path: '**/*.{ts,tsx}'
          instructions: |
              Treat .prettierrc and Prettier output as the formatting source of truth. Do not request formatting that Prettier reverses.
              Treat ESLint as the source of truth for enforceable code-style rules.
              Do not raise brace-only style comments unless the ESLint configuration enforces braces.
              Require explicit types when they define a public contract, domain state, boundary data, or otherwise preserve important intent.
              Do not require redundant annotations for values inferred from typed inputs or for obvious JSX returns.
              Choose type or interface according to the type's purpose and established repository conventions rather than requiring one universally.
              Prefer unknown with runtime narrowing over any for untrusted boundary data.
              Evaluate functions, hooks, and files by single responsibility and independent reasons to change, not by a fixed line count.
              Consider a shared abstraction when the same concept has a third real use case; do not extract code only because two snippets look similar.
              Keep domain state, rules, types, constants, and transformations in a single source of truth.
              For asynchronous UI, distinguish initial loading, cached refetch, empty, partial error, full error, and success states where applicable.
              Check skeletons against final layout size and layout shift, and preserve cached content during background refetch.
              Keep independent resource failures and retry actions scoped to the affected resource.
              Verify live regions, aria-busy, and reduced-motion behavior when asynchronous or animated UI changes.
              Ensure tests restore global state and spies so they remain isolated and order-independent.
              Confirm findings against the current code and reproducible evidence before presenting them as actionable defects.

        - path: '**/*.json'
          instructions: "Indent size for JSON files needs to be 2.\n
              In JSON, an array wrapping needs to be split into lines.\n
              Trailing commas in JSON need to be removed.\n
              Object wrapping in JSON needs to be split into lines.\n
              Avoid alignment of properties in JSON.\n
              Space needs to be introduced after colon and comma in JSON.\n
              Do not introduce space before colon or comma in JSON."

        - path: 'src/components/**'
          instructions: "This file belongs to the View layer in MVVM.\n
              Components must be purely presentational; no direct API calls (fetch, axios, react-query mutations/queries) are allowed here.\n
              Business logic and state transformations must live in a ViewModel hook under src/hooks/.\n
              Components must receive data and callbacks via props or by calling a ViewModel hook.\n
              Avoid useState for derived state that can be computed from props.\n
              Do not import from src/api/ directly."

        - path: 'src/pages/**'
          instructions: "This file belongs to the View layer (page entry) in MVVM.\n
              Pages may compose View components and call ViewModel hooks, but must not contain business logic themselves.\n
              API calls must be delegated to a ViewModel hook under src/hooks/.\n
              Pages should not import from src/api/ directly."

        - path: 'src/hooks/**'
          instructions: "This file belongs to the ViewModel layer in MVVM.\n
              Hooks must encapsulate all state management, side effects, and data transformation between Model and View.\n
              A ViewModel hook should expose only the data and callbacks that the View needs — no raw Model objects.\n
              Do not render JSX or import React UI components inside hooks.\n
              Each hook should have a single, clear responsibility (SRP).\n
              Prefer returning plain values and callbacks; avoid exposing internal state setters directly."

        - path: 'src/api/**'
          instructions: "This file belongs to the Model layer in MVVM.\n
              Must contain only API client calls and response mapping.\n
              No UI concerns, no React hooks, no JSX.\n
              Functions must be pure and free of side effects beyond HTTP requests."

        - path: 'src/types/**'
          instructions: "This file belongs to the Model layer (type definitions) in MVVM.\n
              Must contain only TypeScript type and interface definitions.\n
              No runtime logic, no imports from View or ViewModel layers."

        - path: 'src/schemas/**'
          instructions: "This file belongs to the Model layer (validation schemas) in MVVM.\n
              Must contain only Zod schemas or equivalent validation definitions.\n
              No UI logic, no React imports."

        - path: 'src/utils/**'
          instructions: "This file belongs to the utility layer in MVVM.\n
              Must contain only pure functions with no side effects.\n
              Functions must depend solely on their input arguments to produce output.\n
              No React hooks, no JSX, no API calls, no direct state mutation.\n
              No imports from src/components/, src/pages/, or src/hooks/."

        - path: 'src/stores/**'
          instructions: "This file belongs to the Model layer (global state) in MVVM.\n
              Zustand stores must hold only global application state and actions.\n
              No JSX, no API calls directly inside store actions (delegate to src/api/).\n
              Store actions should remain pure state transitions where possible."

chat:
    auto_reply: true
