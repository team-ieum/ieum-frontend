name: Frontend Dev Server Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: frontend_dev_server
  cancel-in-progress: false

env:
  NODE_VERSION: ${{ secrets.NODE_VERSION }}
  IMAGE_NAME: ${{ secrets.IMAGE_NAME }}

jobs:
  deploy:
    # Covers bounded cross-repository lock waiting plus this job's build and deployment.
    timeout-minutes: 360
    name: Deploy Dev to Self Hosted Server
    runs-on:
      group: ieum_dev_server
      labels: [self-hosted, linux, x64, ieum-frontend]

    steps:
      - name: Establish deployment job budget
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PYBUDGET'
          from datetime import datetime, timezone
          import json
          import os
          import time
          import urllib.request

          try:
              # A workflow attempt starts before this job, so queue/setup time reduces the budget too.
              run_id, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
              endpoint = (os.environ['GITHUB_API_URL'].rstrip('/') + '/repos/' + os.environ['GITHUB_REPOSITORY']
                  + '/actions/runs/' + run_id + '/attempts/' + attempt)
              request = urllib.request.Request(endpoint, headers={
                  'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=15) as response:
                  raw = response.read(1024 * 1024 + 1)
              if len(raw) > 1024 * 1024:
                  raise ValueError()
              data = json.loads(raw)
              if str(data['id']) != run_id or str(data['run_attempt']) != attempt:
                  raise ValueError()
              started = datetime.fromisoformat(data['run_started_at'].replace('Z', '+00:00'))
              now = time.time()
              if started.tzinfo is None or started.timestamp() > now:
                  raise ValueError()
              # Leave two minutes before the runner's 360-minute job timeout.
              deadline = int(started.timestamp()) + 360 * 60 - 120
              if deadline - now < 7200:
                  raise ValueError()
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('IEUM_BLUEGREEN_JOB_DEADLINE_EPOCH=' + str(deadline) + '\n')
          except Exception:
              # Never echo the request, token, response or environment.
              raise SystemExit('Unable to establish sufficient deployment job time; retry in a fresh job') from None
          PYBUDGET

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run --passWithNoTests

      - name: Build frontend
        run: npx vite build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Write nginx config
        run: |
          mkdir -p .deploy

          cat > .deploy/default.conf <<'EOF'
          server {
            listen 80;
            server_name _;

            root /usr/share/nginx/html;
            index index.html;

            location / {
              try_files $uri $uri/ /index.html;
            }

            # Every Vite asset must return 404 when absent so the host archive fallback runs.
            location ^~ /assets/ {
              expires 30d;
              add_header Cache-Control "public, immutable";
              try_files $uri =404;
            }

            location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
              expires 30d;
              add_header Cache-Control "public, immutable";
              try_files $uri =404;
            }
          }
          EOF

      - name: Write Dockerfile
        run: |
          cat > Dockerfile.ci <<'EOF'
          FROM nginx:1.29-alpine
          COPY dist /usr/share/nginx/html
          COPY .deploy/default.conf /etc/nginx/conf.d/default.conf
          EXPOSE 80
          EOF

      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfile.ci \
            -t "$IMAGE_NAME:${{ github.sha }}" \
            -t "$IMAGE_NAME:latest" .

      - name: Verify installed blue-green release
        env:
          CONTROLLER_SHA: ${{ vars.BLUEGREEN_CONTROLLER_SHA256 }}
          HELPER_SHA: ${{ vars.BLUEGREEN_HELPER_SHA256 }}
        run: |
          set -euo pipefail
          if [[ ! "$CONTROLLER_SHA" =~ ^[a-f0-9]{64}$ || ! "$HELPER_SHA" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Configure the approved BLUEGREEN_CONTROLLER_SHA256 and BLUEGREEN_HELPER_SHA256 variables first"
            exit 1
          fi
          if ! printf '%s  %s\n' \
            "$CONTROLLER_SHA" /home/kwung/deploy/bluegreen/bluegreen.py \
            "$HELPER_SHA" /usr/local/sbin/ieum-bluegreen-nginx | sha256sum -c - >/dev/null 2>&1; then
            echo "::error::Installed blue-green controller/helper does not match the approved release"
            exit 1
          fi

      - name: Deploy with a private candidate environment
        env:
          IMAGE_TAG: ${{ github.sha }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          set -euo pipefail
          umask 077
          candidate_env="$(mktemp "$RUNNER_TEMP/ieum-frontend-env.XXXXXX")"
          trap 'rm -f -- "$candidate_env"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          python3 - "$candidate_env" <<'PY'
          import os
          import sys
          from pathlib import Path

          value = os.environ['VITE_API_URL']
          if '\n' in value or '\r' in value:
              raise SystemExit('VITE_API_URL must be a single line')
          Path(sys.argv[1]).write_text('VITE_API_URL=' + value + '\nNODE_ENV=production\n')
          PY
          python3 /home/kwung/deploy/bluegreen/bluegreen.py --lock-timeout 14400 deploy \
            --job-deadline-epoch "$IEUM_BLUEGREEN_JOB_DEADLINE_EPOCH" \
            --service frontend \
            --image "$IMAGE_NAME:$IMAGE_TAG" \
            --env-file "$candidate_env"
