name: Blue Green Hosted Test (Temporary)

on:
  push:
    branches: ['infra/IEUM-FE-69']

permissions:
  contents: read

concurrency:
  group: bluegreen-hosted-test-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  IMAGE_NAME: ieum-frontend-hosted-test
  VITE_API_URL: https://example.invalid

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Lint
        run: npm run lint

      - name: Test
        run: |
          python3 -m unittest discover -s scripts/bluegreen -p 'test_*.py'
          npm test -- --run --passWithNoTests

      - name: Build frontend with public test configuration
        run: npm run build

      - name: Write nginx config
        run: |
          mkdir -p .deploy

          cat > .deploy/default.conf <<'EOF'
          server {
            listen 80;
            server_name _;

            root /usr/share/nginx/html;
            index index.html;

            location / {
              try_files $uri $uri/ /index.html;
            }

            # Every Vite asset must return 404 when absent so the host archive fallback runs.
            location ^~ /assets/ {
              expires 30d;
              add_header Cache-Control "public, immutable";
              try_files $uri =404;
            }

            location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
              expires 30d;
              add_header Cache-Control "public, immutable";
              try_files $uri =404;
            }
          }
          EOF

      - name: Write Dockerfile
        run: |
          cat > Dockerfile.ci <<'EOF'
          FROM nginx:1.29-alpine
          COPY dist /usr/share/nginx/html
          COPY .deploy/default.conf /etc/nginx/conf.d/default.conf
          EXPOSE 80
          EOF

      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfile.ci \
            -t "$IMAGE_NAME:${{ github.sha }}" \
            -t "$IMAGE_NAME:latest" .
