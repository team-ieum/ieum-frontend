name: Frontend Main Server Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend_main_server
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: ${{ secrets.NODE_VERSION }}
  IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
  CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
  DOCKER_NETWORK: ${{ secrets.DOCKER_NETWORK }}
  DOCKER_NETWORK_SUBNET: ${{ secrets.DOCKER_NETWORK_SUBNET }}
  FRONTEND_IP: ${{ secrets.FRONTEND_IP }}
  IMAGE_RETENTION_COUNT: ${{ vars.IMAGE_RETENTION_COUNT }}

jobs:
  deploy:
    name: Deploy Main to Self Hosted Server
    runs-on:
      group: ieum_main_server
      labels: [self-hosted, linux, x64, ieum-frontend, main, deploy]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate deploy secrets
        run: |
          set -euo pipefail

          missing_vars=()
          for name in \
            NODE_VERSION \
            IMAGE_NAME \
            CONTAINER_NAME \
            DOCKER_NETWORK \
            DOCKER_NETWORK_SUBNET \
            FRONTEND_IP
          do
            [ -n "${!name}" ] || missing_vars+=("$name")
          done

          if [ ${#missing_vars[@]} -gt 0 ]; then
            echo "::error::Missing deploy secrets for: ${missing_vars[*]}"
            exit 1
          fi

      - name: Validate app secrets
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          set -euo pipefail

          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Missing app secrets for: VITE_API_URL"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run --passWithNoTests

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Write nginx config
        run: |
          mkdir -p .deploy

          cat > .deploy/default.conf <<'EOF'
          server {
            listen 80;
            server_name _;

            root /usr/share/nginx/html;
            index index.html;

            location / {
              try_files $uri $uri/ /index.html;
            }

            location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
              expires 30d;
              add_header Cache-Control "public, immutable";
              try_files $uri =404;
            }
          }
          EOF

      - name: Write Dockerfile
        run: |
          cat > Dockerfile.ci <<'EOF'
          FROM nginx:1.29-alpine
          COPY dist /usr/share/nginx/html
          COPY .deploy/default.conf /etc/nginx/conf.d/default.conf
          EXPOSE 80
          EOF

      - name: Build Docker image
        run: |
          set -euo pipefail

          docker build \
            -f Dockerfile.ci \
            -t "$IMAGE_NAME:${{ github.sha }}" \
            -t "$IMAGE_NAME:latest" .

      - name: Deploy frontend container
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          CANDIDATE_CONTAINER="${CONTAINER_NAME}-candidate-${IMAGE_TAG:0:12}"
          PREVIOUS_IMAGE_ID="$(docker inspect -f '{{.Image}}' "$CONTAINER_NAME" 2>/dev/null || true)"
          REPLACEMENT_STARTED=false

          cleanup_candidate() {
            docker rm -f "$CANDIDATE_CONTAINER" >/dev/null 2>&1 || true
          }

          rollback() {
            cleanup_candidate

            if [ "$REPLACEMENT_STARTED" = "true" ] && [ -n "$PREVIOUS_IMAGE_ID" ]; then
              docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
              docker run -d \
                --name "$CONTAINER_NAME" \
                --restart unless-stopped \
                --network "$DOCKER_NETWORK" \
                --ip "$FRONTEND_IP" \
                "$PREVIOUS_IMAGE_ID" >/dev/null || true
            fi
          }

          wait_for_http() {
            local url="$1"
            local logs_container="$2"

            for i in $(seq 1 30); do
              if curl -fsS "$url" >/dev/null; then
                return 0
              fi

              sleep 2
            done

            docker logs --tail 100 "$logs_container" || true
            return 1
          }

          trap rollback ERR INT TERM

          docker network inspect "$DOCKER_NETWORK" >/dev/null 2>&1 \
            || docker network create --subnet "$DOCKER_NETWORK_SUBNET" "$DOCKER_NETWORK"

          cleanup_candidate

          docker run -d \
            --name "$CANDIDATE_CONTAINER" \
            --restart no \
            --network "$DOCKER_NETWORK" \
            "$IMAGE_NAME:$IMAGE_TAG" >/dev/null

          CANDIDATE_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$CANDIDATE_CONTAINER")"
          wait_for_http "http://$CANDIDATE_IP/" "$CANDIDATE_CONTAINER"
          cleanup_candidate

          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          REPLACEMENT_STARTED=true

          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            --network "$DOCKER_NETWORK" \
            --ip "$FRONTEND_IP" \
            "$IMAGE_NAME:$IMAGE_TAG" >/dev/null

          wait_for_http "http://$FRONTEND_IP/" "$CONTAINER_NAME"

          trap - ERR INT TERM

      - name: Clean up old frontend images
        if: success()
        run: |
          set -euo pipefail

          RETENTION_COUNT="${IMAGE_RETENTION_COUNT:-5}"

          if ! [[ "$RETENTION_COUNT" =~ ^[0-9]+$ ]] || [ "$RETENTION_COUNT" -lt 1 ]; then
            echo "::error::IMAGE_RETENTION_COUNT must be a positive integer"
            exit 1
          fi

          mapfile -t OLD_IMAGES < <(
            docker images "$IMAGE_NAME" --format '{{.Repository}}:{{.Tag}}' |
              awk -v image="$IMAGE_NAME" -v keep="$RETENTION_COUNT" '
                index($0, image ":") == 1 {
                  tag = substr($0, length(image) + 2)
                  if (tag ~ /^[0-9a-f]{40}$/) {
                    count++
                    if (count > keep) print $0
                  }
                }
              '
          )

          if [ ${#OLD_IMAGES[@]} -gt 0 ]; then
            docker rmi "${OLD_IMAGES[@]}" || true
          fi
