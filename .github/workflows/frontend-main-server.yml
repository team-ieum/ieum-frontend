name: Frontend Main Server Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Build only, configure/stage bootstrap, or deploy MAIN
        type: choice
        required: true
        default: build
        options: [build, configure-frontend, stage-bootstrap, deploy]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'frontend_main_bluegreen' || format('frontend_main_build_{0}', github.ref) }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: ${{ secrets.MAIN_COM_NODE_VERSION }}
  IMAGE_NAME: ${{ secrets.MAIN_COM_IMAGE_NAME }}

jobs:
  build:
    name: Test and build MAIN frontend on GitHub
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/infra/IEUM-FE-95' && inputs.operation == 'build')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      image_id: ${{ steps.bundle.outputs.image_id }}
      archive_sha256: ${{ steps.bundle.outputs.archive_sha256 }}
      settings_sha256: ${{ steps.bundle.outputs.settings_sha256 }}
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate MAIN CI settings
        run: python3 scripts/bluegreen/frontend_env.py validate-ci --environment main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Lint
        run: npm run lint

      - name: Test
        run: |
          python3 -m unittest discover -s scripts/bluegreen -p 'test_*.py'
          npm test -- --run --passWithNoTests

      - name: Type check
        run: npx --no-install tsc -b --noEmit

      - name: Build frontend from MAIN Secrets
        id: frontend_settings
        env:
          MAIN_COM_VITE_API_URL: ${{ secrets.MAIN_COM_VITE_API_URL }}
          MAIN_COM_VITE_MEASUREMENT_MODE: ${{ secrets.MAIN_COM_VITE_MEASUREMENT_MODE }}
          MAIN_COM_VITE_MEASUREMENT_DELAY_MS: ${{ secrets.MAIN_COM_VITE_MEASUREMENT_DELAY_MS }}
          MAIN_COM_DATA_DOCKER_NETWORK: ${{ secrets.MAIN_COM_DATA_DOCKER_NETWORK }}
          MAIN_COM_DATA_DOCKER_NETWORK_SUBNET: ${{ secrets.MAIN_COM_DATA_DOCKER_NETWORK_SUBNET }}
          MAIN_COM_POSTGRES_CONTAINER_NAME: ${{ secrets.MAIN_COM_POSTGRES_CONTAINER_NAME }}
          MAIN_COM_REDIS_CONTAINER_NAME: ${{ secrets.MAIN_COM_REDIS_CONTAINER_NAME }}
          MAIN_COM_MONGO_CONTAINER_NAME: ${{ secrets.MAIN_COM_MONGO_CONTAINER_NAME }}
          MAIN_BLUE_DOCKER_NETWORK: ${{ secrets.MAIN_BLUE_DOCKER_NETWORK }}
          MAIN_BLUE_DOCKER_NETWORK_SUBNET: ${{ secrets.MAIN_BLUE_DOCKER_NETWORK_SUBNET }}
          MAIN_BLUE_CONTAINER_NAME: ${{ secrets.MAIN_BLUE_CONTAINER_NAME }}
          MAIN_BLUE_FRONTEND_IP: ${{ secrets.MAIN_BLUE_FRONTEND_IP }}
          MAIN_BLUE_BACKEND_IP: ${{ secrets.MAIN_BLUE_BACKEND_IP }}
          MAIN_BLUE_AGENT_IP: ${{ secrets.MAIN_BLUE_AGENT_IP }}
          MAIN_BLUE_FRONTEND_ENV_DIR: ${{ secrets.MAIN_BLUE_FRONTEND_ENV_DIR }}
          MAIN_BLUE_FRONTEND_ENV_FILE: ${{ secrets.MAIN_BLUE_FRONTEND_ENV_FILE }}
          MAIN_GREEN_DOCKER_NETWORK: ${{ secrets.MAIN_GREEN_DOCKER_NETWORK }}
          MAIN_GREEN_DOCKER_NETWORK_SUBNET: ${{ secrets.MAIN_GREEN_DOCKER_NETWORK_SUBNET }}
          MAIN_GREEN_CONTAINER_NAME: ${{ secrets.MAIN_GREEN_CONTAINER_NAME }}
          MAIN_GREEN_FRONTEND_IP: ${{ secrets.MAIN_GREEN_FRONTEND_IP }}
          MAIN_GREEN_BACKEND_IP: ${{ secrets.MAIN_GREEN_BACKEND_IP }}
          MAIN_GREEN_AGENT_IP: ${{ secrets.MAIN_GREEN_AGENT_IP }}
          MAIN_GREEN_FRONTEND_ENV_DIR: ${{ secrets.MAIN_GREEN_FRONTEND_ENV_DIR }}
          MAIN_GREEN_FRONTEND_ENV_FILE: ${{ secrets.MAIN_GREEN_FRONTEND_ENV_FILE }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          settings_dir="$(mktemp -d "$RUNNER_TEMP/ieum-frontend-settings.XXXXXX")"
          printf 'directory=%s\n' "$settings_dir" >> "$GITHUB_OUTPUT"
          python3 scripts/bluegreen/frontend_env.py build "$settings_dir" --environment main
          unset "${!MAIN_@}"

      - name: Write nginx config
        run: |
          mkdir -p .deploy

          cat > .deploy/default.conf <<'EOF'
          server {
            listen 80;
            server_name _;

            root /usr/share/nginx/html;
            index index.html;

            location / {
              try_files $uri $uri/ /index.html;
            }

            # Every Vite asset must return 404 when absent so the host archive fallback runs.
            location ^~ /assets/ {
              expires 30d;
              add_header Cache-Control "public, immutable";
              try_files $uri =404;
            }

            location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
              expires 30d;
              add_header Cache-Control "public, immutable";
              try_files $uri =404;
            }
          }
          EOF

      - name: Write Dockerfile
        run: |
          cat > Dockerfile.ci <<'EOF'
          FROM nginx:1.29-alpine
          COPY dist /usr/share/nginx/html
          # 비공개 설정 단계의 umask 077로 생성된 공개 파일을 nginx worker가 읽을 수 있게 합니다.
          RUN chmod -R a+rX /usr/share/nginx/html
          COPY .deploy/default.conf /etc/nginx/conf.d/default.conf
          EXPOSE 80
          EOF

      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfile.ci \
            -t "$IMAGE_NAME:${{ github.sha }}" .

      - name: Check frontend HTTP responses in the built image
        run: python3 scripts/bluegreen/frontend_smoke.py --image "$IMAGE_NAME:${{ github.sha }}"

      - name: Package image without private environment files
        id: bundle
        env:
          SETTINGS_DIR: ${{ steps.frontend_settings.outputs.directory }}
        run: |
          set -euo pipefail
          bundle_dir="$(mktemp -d "$RUNNER_TEMP/ieum-frontend-bundle.XXXXXX")"
          printf 'directory=%s\n' "$bundle_dir" >> "$GITHUB_OUTPUT"
          python3 scripts/bluegreen/frontend_artifact.py pack \
            --directory "$bundle_dir" --settings-directory "$SETTINGS_DIR"

      - name: Upload immutable MAIN image artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: frontend-main-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.bundle.outputs.directory }}/frontend-image.tar
            ${{ steps.bundle.outputs.directory }}/frontend-image.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Summarize verified MAIN artifact
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          IMAGE_ID: ${{ steps.bundle.outputs.image_id }}
          ARCHIVE_SHA: ${{ steps.bundle.outputs.archive_sha256 }}
        run: |
          printf 'Source: `%s`\n\nImage ID: `%s`\n\nArchive SHA-256: `%s`\n\nArtifact ID: `%s`\n' \
            "$GITHUB_SHA" "$IMAGE_ID" "$ARCHIVE_SHA" "$ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove private build settings
        if: always()
        env:
          SETTINGS_DIR: ${{ steps.frontend_settings.outputs.directory }}
        run: python3 scripts/bluegreen/frontend_env.py cleanup "$SETTINGS_DIR" --environment main

      - name: Remove local build artifact
        if: always()
        env:
          ARTIFACT_DIR: ${{ steps.bundle.outputs.directory }}
        run: python3 scripts/bluegreen/frontend_artifact.py cleanup --directory "$ARTIFACT_DIR"

  deploy:
    name: Deploy verified MAIN frontend artifact
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (((github.event_name == 'push' || inputs.operation == 'deploy') && vars.MAIN_DEPLOY_ENABLED == 'true') ||
      ((inputs.operation == 'configure-frontend' || inputs.operation == 'stage-bootstrap') && vars.MAIN_BOOTSTRAP_ENABLED == 'true'))
    timeout-minutes: 360
    runs-on:
      group: ieum_main_server
      labels: [self-hosted, linux, x64, ieum-frontend, main, deploy]
    steps:
      - name: Establish deployment job budget
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PYBUDGET'
          from datetime import datetime, timezone
          import json
          import os
          import time
          import urllib.request

          try:
              # A workflow attempt starts before this job, so queue/setup time reduces the budget too.
              run_id, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
              endpoint = (os.environ['GITHUB_API_URL'].rstrip('/') + '/repos/' + os.environ['GITHUB_REPOSITORY']
                  + '/actions/runs/' + run_id + '/attempts/' + attempt)
              request = urllib.request.Request(endpoint, headers={
                  'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=15) as response:
                  raw = response.read(1024 * 1024 + 1)
              if len(raw) > 1024 * 1024:
                  raise ValueError()
              data = json.loads(raw)
              if str(data['id']) != run_id or str(data['run_attempt']) != attempt:
                  raise ValueError()
              started = datetime.fromisoformat(data['run_started_at'].replace('Z', '+00:00'))
              now = time.time()
              if started.tzinfo is None or started.timestamp() > now:
                  raise ValueError()
              # Leave two minutes before the runner's 360-minute job timeout.
              deadline = int(started.timestamp()) + 360 * 60 - 120
              if deadline - now < 9000:
                  raise ValueError()
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('IEUM_BLUEGREEN_JOB_DEADLINE_EPOCH=' + str(deadline) + '\n')
          except Exception:
              # Never echo the request, token, response or environment.
              raise SystemExit('Unable to establish sufficient deployment job time; retry in a fresh job') from None
          PYBUDGET

      - name: Checkout immutable deployment scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Create empty artifact directory
        id: artifact
        run: |
          set -euo pipefail
          printf 'directory=%s\n' "$(mktemp -d "$RUNNER_TEMP/ieum-frontend-artifact.XXXXXX")" >> "$GITHUB_OUTPUT"

      - name: Download this run's verified image artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ steps.artifact.outputs.directory }}
          merge-multiple: true

      - name: Restore MAIN settings and verify build snapshot
        id: frontend_settings
        env:
          MAIN_COM_VITE_API_URL: ${{ secrets.MAIN_COM_VITE_API_URL }}
          MAIN_COM_VITE_MEASUREMENT_MODE: ${{ secrets.MAIN_COM_VITE_MEASUREMENT_MODE }}
          MAIN_COM_VITE_MEASUREMENT_DELAY_MS: ${{ secrets.MAIN_COM_VITE_MEASUREMENT_DELAY_MS }}
          MAIN_COM_DATA_DOCKER_NETWORK: ${{ secrets.MAIN_COM_DATA_DOCKER_NETWORK }}
          MAIN_COM_DATA_DOCKER_NETWORK_SUBNET: ${{ secrets.MAIN_COM_DATA_DOCKER_NETWORK_SUBNET }}
          MAIN_COM_POSTGRES_CONTAINER_NAME: ${{ secrets.MAIN_COM_POSTGRES_CONTAINER_NAME }}
          MAIN_COM_REDIS_CONTAINER_NAME: ${{ secrets.MAIN_COM_REDIS_CONTAINER_NAME }}
          MAIN_COM_MONGO_CONTAINER_NAME: ${{ secrets.MAIN_COM_MONGO_CONTAINER_NAME }}
          MAIN_BLUE_DOCKER_NETWORK: ${{ secrets.MAIN_BLUE_DOCKER_NETWORK }}
          MAIN_BLUE_DOCKER_NETWORK_SUBNET: ${{ secrets.MAIN_BLUE_DOCKER_NETWORK_SUBNET }}
          MAIN_BLUE_CONTAINER_NAME: ${{ secrets.MAIN_BLUE_CONTAINER_NAME }}
          MAIN_BLUE_FRONTEND_IP: ${{ secrets.MAIN_BLUE_FRONTEND_IP }}
          MAIN_BLUE_BACKEND_IP: ${{ secrets.MAIN_BLUE_BACKEND_IP }}
          MAIN_BLUE_AGENT_IP: ${{ secrets.MAIN_BLUE_AGENT_IP }}
          MAIN_BLUE_FRONTEND_ENV_DIR: ${{ secrets.MAIN_BLUE_FRONTEND_ENV_DIR }}
          MAIN_BLUE_FRONTEND_ENV_FILE: ${{ secrets.MAIN_BLUE_FRONTEND_ENV_FILE }}
          MAIN_GREEN_DOCKER_NETWORK: ${{ secrets.MAIN_GREEN_DOCKER_NETWORK }}
          MAIN_GREEN_DOCKER_NETWORK_SUBNET: ${{ secrets.MAIN_GREEN_DOCKER_NETWORK_SUBNET }}
          MAIN_GREEN_CONTAINER_NAME: ${{ secrets.MAIN_GREEN_CONTAINER_NAME }}
          MAIN_GREEN_FRONTEND_IP: ${{ secrets.MAIN_GREEN_FRONTEND_IP }}
          MAIN_GREEN_BACKEND_IP: ${{ secrets.MAIN_GREEN_BACKEND_IP }}
          MAIN_GREEN_AGENT_IP: ${{ secrets.MAIN_GREEN_AGENT_IP }}
          MAIN_GREEN_FRONTEND_ENV_DIR: ${{ secrets.MAIN_GREEN_FRONTEND_ENV_DIR }}
          MAIN_GREEN_FRONTEND_ENV_FILE: ${{ secrets.MAIN_GREEN_FRONTEND_ENV_FILE }}
          ARTIFACT_DIR: ${{ steps.artifact.outputs.directory }}
          IEUM_EXPECTED_IMAGE_ID: ${{ needs.build.outputs.image_id }}
          IEUM_EXPECTED_ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
          IEUM_EXPECTED_SETTINGS_SHA256: ${{ needs.build.outputs.settings_sha256 }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          settings_dir="$(mktemp -d "$RUNNER_TEMP/ieum-frontend-settings.XXXXXX")"
          printf 'directory=%s\n' "$settings_dir" >> "$GITHUB_OUTPUT"
          python3 scripts/bluegreen/frontend_env.py restore "$settings_dir" --environment main
          unset "${!MAIN_@}"
          python3 scripts/bluegreen/frontend_artifact.py verify \
            --directory "$ARTIFACT_DIR" --settings-directory "$settings_dir"

      - name: Verify installed MAIN controller and helper
        env:
          CONTROLLER_SHA: ${{ vars.MAIN_BLUEGREEN_CONTROLLER_SHA256 }}
          HELPER_SHA: ${{ vars.MAIN_BLUEGREEN_HELPER_SHA256 }}
        run: |
          set -euo pipefail
          if [[ ! "$CONTROLLER_SHA" =~ ^[a-f0-9]{64}$ || ! "$HELPER_SHA" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Configure MAIN controller and helper release hashes first"
            exit 1
          fi
          if ! printf '%s  %s\n' \
            "$CONTROLLER_SHA" /home/kwung/deploy/bluegreen-main/bluegreen.py \
            "$HELPER_SHA" /usr/local/sbin/ieum-main-bluegreen-nginx | sha256sum -c - >/dev/null 2>&1; then
            echo "::error::Installed MAIN controller/helper release differs from the approved hashes"
            exit 1
          fi

      - name: Configure MAIN frontend deployment settings
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'configure-frontend'
        env:
          SETTINGS_DIR: ${{ steps.frontend_settings.outputs.directory }}
        run: |
          set -euo pipefail
          python3 scripts/bluegreen/frontend_env.py verify "$SETTINGS_DIR" --environment main
          IEUM_DEPLOY_ENVIRONMENT=main python3 /home/kwung/deploy/bluegreen-main/bluegreen.py --lock-timeout 30 configure-frontend \
            --settings-file "$SETTINGS_DIR/frontend-deployment.json"

      - name: Load verified MAIN image
        id: loaded
        if: github.event_name == 'push' || inputs.operation == 'deploy' || inputs.operation == 'stage-bootstrap'
        env:
          SETTINGS_DIR: ${{ steps.frontend_settings.outputs.directory }}
          ARTIFACT_DIR: ${{ steps.artifact.outputs.directory }}
          IEUM_EXPECTED_IMAGE_ID: ${{ needs.build.outputs.image_id }}
          IEUM_EXPECTED_ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
          IEUM_EXPECTED_SETTINGS_SHA256: ${{ needs.build.outputs.settings_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/bluegreen/frontend_artifact.py load \
            --directory "$ARTIFACT_DIR" --settings-directory "$SETTINGS_DIR"

      - name: Stage immutable MAIN frontend for bootstrap
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'stage-bootstrap'
        env:
          SETTINGS_DIR: ${{ steps.frontend_settings.outputs.directory }}
          IMAGE_ID: ${{ steps.loaded.outputs.image_id }}
        run: |
          set -euo pipefail
          python3 scripts/bluegreen/frontend_env.py verify "$SETTINGS_DIR" --environment main
          IEUM_DEPLOY_ENVIRONMENT=main python3 /home/kwung/deploy/bluegreen-main/bluegreen.py --lock-timeout 30 stage-bootstrap \
            --service frontend --image "$IMAGE_ID" \
            --env-file "$SETTINGS_DIR/frontend.env" \
            --frontend-deployment-file "$SETTINGS_DIR/frontend-deployment.json"

      - name: Deploy immutable MAIN frontend snapshot
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
        env:
          SETTINGS_DIR: ${{ steps.frontend_settings.outputs.directory }}
          IMAGE_ID: ${{ steps.loaded.outputs.image_id }}
        run: |
          set -euo pipefail
          python3 scripts/bluegreen/frontend_env.py verify "$SETTINGS_DIR" --environment main
          IEUM_DEPLOY_ENVIRONMENT=main python3 /home/kwung/deploy/bluegreen-main/bluegreen.py --lock-timeout 14400 deploy \
            --job-deadline-epoch "$IEUM_BLUEGREEN_JOB_DEADLINE_EPOCH" \
            --service frontend --image "$IMAGE_ID" \
            --env-file "$SETTINGS_DIR/frontend.env" \
            --frontend-deployment-file "$SETTINGS_DIR/frontend-deployment.json" \
            --replace-env

      - name: Remove private MAIN deployment settings
        if: always()
        env:
          SETTINGS_DIR: ${{ steps.frontend_settings.outputs.directory }}
        run: python3 scripts/bluegreen/frontend_env.py cleanup "$SETTINGS_DIR" --environment main

      - name: Remove downloaded image archive
        if: always()
        env:
          ARTIFACT_DIR: ${{ steps.artifact.outputs.directory }}
        run: python3 scripts/bluegreen/frontend_artifact.py cleanup --directory "$ARTIFACT_DIR"
