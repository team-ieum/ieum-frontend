name: Frontend Main Server Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend_main_server
  cancel-in-progress: true

env:
  NODE_VERSION: ${{ secrets.NODE_VERSION }}
  IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
  CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
  DOCKER_NETWORK: ${{ secrets.DOCKER_NETWORK }}
  DOCKER_NETWORK_SUBNET: ${{ secrets.DOCKER_NETWORK_SUBNET }}
  FRONTEND_IP: ${{ secrets.FRONTEND_IP }}

jobs:
  deploy:
    name: Deploy Main to Self Hosted Server
    runs-on:
      group: ieum_main_server
      labels: [self-hosted, linux, x64, ieum-frontend, main, deploy]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: |
          set -euo pipefail

          missing_vars=()
          for name in \
            NODE_VERSION \
            IMAGE_NAME \
            CONTAINER_NAME \
            DOCKER_NETWORK \
            DOCKER_NETWORK_SUBNET \
            FRONTEND_IP
          do
            [ -n "${!name}" ] || missing_vars+=("$name")
          done

          if [ ${#missing_vars[@]} -gt 0 ]; then
            echo "::error::Missing deploy secrets for: ${missing_vars[*]}"
            exit 1
          fi

      - name: Validate app secrets
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          set -euo pipefail

          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Missing app secrets for: VITE_API_URL"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run --passWithNoTests

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Write nginx config
        run: |
          mkdir -p .deploy

          cat > .deploy/default.conf <<'EOF'
          server {
            listen 80;
            server_name _;

            root /usr/share/nginx/html;
            index index.html;

            location / {
              try_files $uri $uri/ /index.html;
            }

            location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
              expires 30d;
              add_header Cache-Control "public, immutable";
              try_files $uri =404;
            }
          }
          EOF

      - name: Write Dockerfile
        run: |
          cat > Dockerfile.ci <<'EOF'
          FROM nginx:1.29-alpine
          COPY dist /usr/share/nginx/html
          COPY .deploy/default.conf /etc/nginx/conf.d/default.conf
          EXPOSE 80
          EOF

      - name: Build Docker image
        run: |
          set -euo pipefail

          docker build \
            -f Dockerfile.ci \
            -t "$IMAGE_NAME:${{ github.sha }}" \
            -t "$IMAGE_NAME:latest" .

      - name: Restart frontend container
        run: |
          set -euo pipefail

          docker network inspect "$DOCKER_NETWORK" >/dev/null 2>&1 \
            || docker network create --subnet "$DOCKER_NETWORK_SUBNET" "$DOCKER_NETWORK"

          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            --network "$DOCKER_NETWORK" \
            --ip "$FRONTEND_IP" \
            "$IMAGE_NAME:latest"

      - name: Health check
        run: |
          set -euo pipefail

          sleep 3
          curl -fsS "http://$FRONTEND_IP/" >/dev/null
